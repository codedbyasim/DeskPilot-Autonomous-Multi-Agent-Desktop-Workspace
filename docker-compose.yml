# ==============================================================================
# DeskPilot — Multi-Agent Autonomous Workspace
# Docker Compose Orchestration
# ==============================================================================

version: '3.8'

services:
  deskpilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: deskpilot:latest
    container_name: deskpilot-workspace
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - DESKPILOT_WEB_MODE=1
      - DEFAULT_OUTPUT_DIR=/app/output
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}
    volumes:
      # Persist generated Word/Excel deliverables on the host
      - ./output:/app/output
      # Persist chat history and conversations
      - ./chats:/app/chats
      # Persist operational logs and audits
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
